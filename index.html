<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScriptZ-Engine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="home" hidden>
  <header class="htop">
    <svg class="logo" viewBox="0 0 220 220"><path class="lg" d=""/></svg>
    <b class="brand">ScriptZ<span>-Engine</span></b>
    <span class="sp"></span>
    <button class="btn" id="hsetup">Setup</button>
    <button class="btn" id="himport">Import game</button>
    <button class="btn p big" id="hnew">+ New game</button>
    <input type="file" id="ifile" accept=".json" hidden>
  </header>
  <h1 class="hero">My games</h1>
  <main id="games" class="gcards"></main>
</div>
<div id="editor" hidden>
  <header class="top">
    <button class="btn" id="back">← Games</button>
    <svg class="logo" viewBox="0 0 220 220"><path class="lg" d=""/></svg>
    <input id="gname" aria-label="Game name">
    <span class="sp"></span>
    <button class="btn p big" id="play">▶ Play</button>
    <button class="btn" id="export">Export .zip</button>
    <button class="btn" id="backup">Backup</button>
  </header>
  <main class="app">
    <aside class="panel" id="left">
      <div class="ph"><h3>Scenes</h3><button class="btn sm" id="addScene">+ Add</button></div>
      <div id="scenes" class="list"></div>
      <div class="ph"><h3>Objects</h3><button class="btn sm" id="addObj">+ Add</button></div>
      <div id="objs" class="list"></div>
      <div class="ph"><h3>Assets</h3><button class="btn sm" id="addAsset">+ Add</button><button class="btn sm" id="draw">Draw</button></div>
      <div id="assets" class="grid"></div>
      <p class="hint">Images, GIFs, videos and sounds. Click an image to use it on the selected object. Drop files here.</p>
      <input type="file" id="afile" accept="image/*,video/*,audio/*" multiple hidden>
    </aside>
    <section class="center">
      <div class="tabs" id="ctabs"><button data-t="scene">Scene</button><button data-t="events">Events</button></div>
      <div id="sceneView" class="stagewrap"><div id="stage"></div></div>
      <div id="eventsView" class="evs" hidden></div>
    </section>
    <aside class="panel" id="right">
      <div class="tabs" id="rtabs"><button data-t="object">Object</button><button data-t="scene">Scene</button><button data-t="game">Game</button></div>
      <div id="rbody"></div>
    </aside>
  </main>
</div>
<div id="oobe" hidden></div>
<div id="dlg" class="modal" hidden></div>
<div id="menu" hidden></div>
<script src="runtime.js"></script>
<script src="zip.js"></script>
<script src="templates.js"></script>
<script src="paint.js"></script>
<script src="app.js"></script>
</body>
</html>
